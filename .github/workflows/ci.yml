name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The test-suite only needs the API and pure-logic dependencies, not torch.
      - run: pip install fastapi "pydantic[email]" httpx pytest
      - run: pytest -q
